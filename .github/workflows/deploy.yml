name: Deploy no GitHub Pages

on:
  push:
    branches: [main, master, claude/carousel-builder-tool-615xp8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
      # Publicar na branch gh-pages ativa o GitHub Pages automaticamente
      # em repositório público — sem precisar mexer nas Settings.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
